<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section aria-labelledby="lg-title" style="background:var(--color-bg);border-bottom:1px solid var(--color-divider)">
  <div style="max-width:1560px;margin:0 auto;padding:clamp(40px,6vw,96px) clamp(18px,3.4vw,56px) clamp(28px,3.4vw,54px)">
    <nav aria-label="Breadcrumb" style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.55;margin-bottom:22px">
      <a href="#/" onClick="{{ go }}" style="color:inherit;text-decoration:none">Home</a> <span style="opacity:.5">/</span> <span style="color:var(--color-accent-700)">{{ title }}</span>
    </nav>
    <h1 id="lg-title" style="font-family:var(--font-heading);font-weight:400;font-size:clamp(32px,5vw,72px);line-height:1.02;letter-spacing:-.02em;margin:0 0 12px">{{ title }}</h1>
    <p style="font-size:12.5px;letter-spacing:.06em;opacity:.55;margin:0">{{ updated }}</p>
  </div>
</section>

<section style="background:var(--color-bg);padding:clamp(34px,5vw,84px) 0 clamp(46px,6.5vw,104px)">
  <div style="max-width:1560px;margin:0 auto;padding:0 clamp(18px,3.4vw,56px);display:grid;grid-template-columns:{{ cols }};gap:clamp(26px,3.4vw,64px);align-items:start">

    <nav aria-label="On this page" style="position:sticky;top:96px;border:1px solid var(--color-divider);background:var(--color-surface)">
      <p style="font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--color-accent);margin:0;padding:15px 18px 11px;border-bottom:1px solid var(--color-divider)">On this page</p>
      <div style="display:grid">
        <sc-for list="{{ toc }}" as="t" hint-placeholder-count="7">
          <a href="{{ t.anchor }}" style="padding:10px 18px;font-size:12.5px;text-decoration:none;color:inherit;border-bottom:1px solid color-mix(in srgb,#201f1d 6%,transparent)" style-hover="color:var(--color-accent-700);background:color-mix(in srgb,#b68235 8%,transparent)">{{ t.h }}</a>
        </sc-for>
      </div>
      <div style="padding:14px 18px;border-top:1px solid var(--color-divider);display:grid;gap:8px">
        <sc-for list="{{ others }}" as="o" hint-placeholder-count="2">
          <a href="{{ o.url }}" onClick="{{ go }}" style="font-size:12px;color:var(--color-accent-700);text-decoration:none">{{ o.t }} →</a>
        </sc-for>
      </div>
    </nav>

    <article style="max-width:74ch">
      <sc-for list="{{ sections }}" as="s" hint-placeholder-count="7">
        <section id="{{ s.id }}" style="padding-bottom:clamp(24px,3vw,40px);margin-bottom:clamp(24px,3vw,40px);border-bottom:1px solid var(--color-divider);scroll-margin-top:110px">
          <h2 style="font-family:var(--font-heading);font-weight:400;font-size:clamp(22px,2.4vw,34px);line-height:1.15;margin:0 0 14px">{{ s.h }}</h2>
          <sc-for list="{{ s.p }}" as="para" hint-placeholder-count="2">
            <p style="font-size:15px;line-height:1.9;text-align:justify;hyphens:auto;opacity:.82;margin:0 0 14px">{{ para }}</p>
          </sc-for>
        </section>
      </sc-for>
      <p style="font-size:12.5px;line-height:1.8;opacity:.5;margin:0">This page is CMS-editable. Its content is provided as a professional baseline and should be reviewed by the company's legal advisers before publication.</p>
    </article>
  </div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;privacy&quot;,&quot;terms&quot;,&quot;cookies&quot;],&quot;default&quot;:&quot;privacy&quot;,&quot;tsType&quot;:&quot;'privacy' | 'terms' | 'cookies'&quot;}}">
class Component extends DCLogic {
  state = { ready: !!window.UAI };
  componentDidMount() {
    this._r = () => this.setState({ ready: true });
    window.addEventListener('uai:ready', this._r);
    this._rz = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this._rz);
  }
  componentWillUnmount() {
    window.removeEventListener('uai:ready', this._r);
    window.removeEventListener('resize', this._rz);
  }
  renderVals() {
    const D = window.UAI;
    const go = (e) => { const a = e.currentTarget.getAttribute('href'); if (a) { e.preventDefault(); location.hash = a; } };
    const kind = this.props.kind || 'privacy';
    const doc = D ? D.legal[kind] : null;
    const slugify = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const map = { privacy: 'Privacy Policy', terms: 'Terms of Use', cookies: 'Cookie Policy' };
    const urls = { privacy: '#/privacy', terms: '#/terms', cookies: '#/cookies' };
    return {
      go,
      cols: (typeof window !== 'undefined' && window.innerWidth < 900) ? 'minmax(0,1fr)' : 'minmax(210px,250px) minmax(0,1fr)',
      title: doc ? doc.title : map[kind],
      updated: doc ? doc.updated : '',
      sections: doc ? doc.sections.map((s) => ({ id: slugify(s.h), h: s.h, p: s.p })) : [],
      toc: doc ? doc.sections.map((s) => ({ h: s.h, anchor: '#' + slugify(s.h) })) : [],
      others: Object.keys(map).filter((k) => k !== kind).map((k) => ({ t: map[k], url: urls[k] }))
    };
  }
}

</script>
</body>
</html>
